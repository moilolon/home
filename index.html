<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moilolon</title>
  <meta name="description" content="moilolon.com: the way into the sites of Moisés López López.">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="moilolon">
  <meta property="og:description" content="The way into the sites of Moisés López López.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://moilolon.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- Theme and language are applied before the first paint, so the page does not flash. -->
  <script src="main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span class="glow one"></span><span class="glow two"></span><span class="mesh"></span></div>

  <header class="top">
    <nav class="controls">
      <div class="switch" id="lang" role="group" data-i18n-label="language">
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
      </div>
      <button class="icon-button" id="theme" data-i18n-label="theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 aria-label="moilolon"><span class="at">~/</span><em>moilolon</em><span class="caret"></span></h1>
    </section>

    <!-- A new site is a new card here and its texts in main.js. -->
    <section class="bento" data-i18n-label="sites">
      <a class="card half tall" href="https://portfolio.moilolon.com">
        <div class="art portfolio" aria-hidden="true">
          <span class="bar w60"></span><span class="bar w90"></span><span class="bar w40"></span>
          <span class="chips"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="body">
          <span class="kicker">portfolio.moilolon.com</span>
          <h2 data-i18n="portfolio.title">Portfolio</h2>
          <p data-i18n="portfolio.text">Who I am and what I do for work.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="card half tall" href="https://dashboard.moilolon.com">
        <div class="art chart" aria-hidden="true">
          <svg viewBox="0 0 200 90" preserveAspectRatio="none"><path class="area" d="M0 70H30V58H62V64H96V40H128V46H160V22H200V90H0Z"/><path class="line" d="M0 70H30V58H62V64H96V40H128V46H160V22H200"/></svg>
        </div>
        <div class="body">
          <span class="kicker">dashboard.moilolon.com</span>
          <h2 data-i18n="dashboards.title">Dashboards</h2>
          <p data-i18n="dashboards.text">Data from home, drawn.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </section>
  </main>

  <footer>
    <span>© <span id="year">2026</span> Moisés López López</span>
    <a class="mono github" href="https://github.com/moilolon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.500c.5.100.700-.200.700-.500v-1.800c-2.800.600-3.400-1.200-3.400-1.200-.400-1.100-1.100-1.500-1.100-1.500-.900-.600.100-.600.100-.600 1 .100 1.500 1 1.500 1 .900 1.500 2.400 1.100 3 .800.100-.600.300-1.100.600-1.300-2.200-.300-4.600-1.100-4.600-5a3.900 3.900 0 0 1 1-2.700 3.600 3.600 0 0 1 .100-2.600s.800-.300 2.800 1a9.500 9.500 0 0 1 5 0c1.900-1.300 2.700-1 2.700-1a3.600 3.600 0 0 1 .100 2.600 3.900 3.900 0 0 1 1 2.700c0 3.900-2.300 4.700-4.600 5 .400.300.700.900.700 1.900V21c0 .300.200.600.700.500A10 10 0 0 0 12 2Z"/></svg>github.com/moilolon</a>
  </footer>

  <script>start();</script>
</body>
</html>
