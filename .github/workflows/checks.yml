name: checks

# What a pull request must pass: the job "checks" is the status the main ruleset requires. The
# scripts parse (nav.js is loaded by every site under moilolon.com) and the local links and files
# exist. Links to other sites are links.yml's, monthly: they break from outside, not here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The scripts parse
        run: for f in *.js; do node --check "$f"; done

      - name: The local links and files exist
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}"
            index.html nav.js README.md
          fail: true
