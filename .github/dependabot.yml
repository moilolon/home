# Keeps the dependencies current: Dependabot opens the pull requests, and the repo's checks
# (typecheck, tests, build) say whether they are safe to merge.
version: 2

updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      assignees:
          - "moilolon"
      schedule:
          interval: "monthly"
      commit-message:
          prefix: "chore"
          include: "scope"
